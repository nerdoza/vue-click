<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue-Click Test Page</title>
  <style>
    body {
      margin: 0;
      font: 12px sans-serif;
    }

    #app {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
    }

    button {
      width: 180px;
      height: 56px;
      touch-action: none;
      user-select: none;
    }

    button.tiny {
      width: 8px;
      height: 8px;
      padding: 0;
    }

    /* A v-click element around others, with a margin of its own to press. */
    .outer {
      display: flex;
      gap: 8px;
      padding: 24px;
      border: 1px solid;
      touch-action: none;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="app"></div>
</body>

</html>
